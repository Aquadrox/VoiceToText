[workspace]
resolver = "3"
members = ["crates/vtt-core", "crates/vtt-asr", "crates/vtt-llm", "crates/vtt-platform", "apps/desktop"]

[workspace.package]
version = "0.4.2"
edition = "2024"
publish = false

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
