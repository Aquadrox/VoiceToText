[workspace]
resolver = "3"
members = [
    "crates/vtt-core",
    "crates/vtt-asr",
    "crates/vtt-llm",
    "crates/vtt-platform",
    "crates/vtt-android",
    "apps/desktop",
]

[workspace.package]
version = "0.24.1"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
