[package]
name = "voicetotext"
description = "VoiceToText : dictée vocale universelle"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
png = "0.18"
# Import de fichiers audio et vidéo (Rust pur, sans FFmpeg).
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
flate2 = "1"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
simplelog = "0.12"
tar = "0.4"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["time"] }
ureq = "3"
vtt-asr = { path = "../../crates/vtt-asr" }
vtt-core = { path = "../../crates/vtt-core" }
vtt-llm = { path = "../../crates/vtt-llm" }
vtt-platform = { path = "../../crates/vtt-platform" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
vtt-asr = { path = "../../crates/vtt-asr", features = ["vulkan"] }
