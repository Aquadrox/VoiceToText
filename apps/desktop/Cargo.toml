[package]
name = "voicetotext"
description = "VoiceToText : dictée vocale universelle"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
log.workspace = true
serde.workspace = true
sha2 = "0.10"
simplelog = "0.12"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
ureq = "3"
vtt-asr = { path = "../../crates/vtt-asr" }
vtt-core = { path = "../../crates/vtt-core" }
vtt-llm = { path = "../../crates/vtt-llm" }
vtt-platform = { path = "../../crates/vtt-platform" }

[target.'cfg(windows)'.dependencies]
vtt-asr = { path = "../../crates/vtt-asr", features = ["vulkan"] }
