name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un nouveau push sur une PR annule la vérification devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Détection des fichiers modifiés (voir .github/scripts/changes.sh).
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Les jobs `linux` et `windows` sont obligatoires pour merger : ils
      # tournent toujours, et ne sautent leurs étapes que pour une PR de doc.
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      # Une release v1.2.3 doit contenir la version 1.2.3 : sinon l'installeur
      # publié afficherait une autre version.
      - name: Version du tag = version du code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, mais Cargo.toml indique $version : monter la version avant de taguer"
            exit 1
          fi
      - name: Dépendances système (WebKitGTK, ALSA)
        if: steps.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
        with:
          # Cache alimenté par `main` seulement, réutilisé par les PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all --check
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy ${{ steps.changes.outputs.packages }} --all-targets -- -D warnings
      - if: steps.changes.outputs.code == 'true'
        run: cargo test ${{ steps.changes.outputs.packages }}

  windows:
    runs-on: windows-latest
    env:
      # La compilation de ggml-vulkan imbrique des dossiers profonds : avec le
      # chemin par défaut, MSBuild dépasse la limite de 260 caractères.
      # D: est le disque du dépôt (D:\a\VoiceToText\VoiceToText).
      CARGO_TARGET_DIR: D:\t
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Les jobs `linux` et `windows` sont obligatoires pour merger : ils
      # tournent toujours, et ne sautent leurs étapes que pour une PR de doc.
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      - name: SDK Vulkan (compilation de whisper.cpp pour le GPU)
        if: steps.changes.outputs.code == 'true'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
        with:
          # Chemin relatif au dépôt : rust-cache le colle derrière la racine,
          # un chemin absolu (C:\t) donnait un dossier inexistant et un cache
          # sans aucun fichier compilé.
          workspaces: ". -> ../../../t"
          # Changer le préfixe repart d'un cache vide (v1 ne contenait que
          # les sources téléchargées).
          prefix-key: v2-rust
          # Cache alimenté par `main` seulement (avec la compilation release),
          # réutilisé par les PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy -p vtt-core -p vtt-platform --all-targets -- -D warnings
      - if: steps.changes.outputs.code == 'true'
        run: cargo test -p vtt-core -p vtt-platform
      # CLI Tauri précompilée (npm) : `cargo install tauri-cli` la recompilait
      # en ~10 min à chaque cache vide.
      - name: Installeur
        if: steps.changes.outputs.code == 'true' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis
      # Release : installeur signé pour la mise à jour automatique. Les
      # secrets ne sont lus qu'ici (tags), jamais dans les PR.
      - name: Installeur signé (release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY absent : impossible de signer la release"
            exit 1
          fi
          npx --yes @tauri-apps/cli@^2 build --bundles nsis --config updater.conf.json
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          name: VoiceToText-installeur-windows
          # .sig : signature de l'installeur (releases uniquement).
          path: |
            D:\t\release\bundle\nsis\*.exe
            D:\t\release\bundle\nsis\*.exe.sig
          if-no-files-found: error

  # Application Android : moteur Rust (vtt-android) compilé pour ARM64, puis
  # APK. PR et `main` : APK de test (identifiant .test, installable à côté de
  # la version publiée) ; tags : APK de release signé avec la clé du projet.
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "29.0.14206865"
      CMAKE_VERSION: "3.31.6"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.android == 'true'
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.android == 'true'
        with:
          prefix-key: v1-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Outils Android (NDK, CMake) et cargo-ndk
        if: steps.changes.outputs.android == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" >/dev/null
          cargo install cargo-ndk --locked
      - if: steps.changes.outputs.android == 'true'
        run: cargo clippy -p vtt-android --all-targets -- -D warnings
      - if: steps.changes.outputs.android == 'true'
        run: cargo test -p vtt-android
      - name: Moteur natif (ARM64)
        if: steps.changes.outputs.android == 'true'
        run: apps/android/build-native.sh
      - name: APK de test
        if: steps.changes.outputs.android == 'true' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/clavier/debug/app-clavier-debug.apk dist/VoiceToText-test.apk
          cp app/build/outputs/apk/bulle/debug/app-bulle-debug.apk dist/VoiceToText-test-bulle.apk
      # Release : APK signé. Les secrets ne sont lus qu'ici (tags), jamais
      # dans les PR ; le fichier de clé n'existe que le temps de la signature.
      - name: APK signé (release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 absent : impossible de signer l'APK"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/voicetotext.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          # AAB (Google Play) : édition « bulle », signée par la même clé.
          ./gradlew --no-daemon assembleRelease bundleBulleRelease
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/clavier/release/app-clavier-release.apk "dist/VoiceToText_${version}_android.apk"
          cp app/build/outputs/apk/bulle/release/app-bulle-release.apk "dist/VoiceToText_${version}_android-bulle.apk"
          cp app/build/outputs/bundle/bulleRelease/app-bulle-release.aab "dist/VoiceToText_${version}_play.aab"
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.android == 'true'
        with:
          name: VoiceToText-android
          path: |
            apps/android/dist/*.apk
            apps/android/dist/*.aab
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: VoiceToText-installeur-windows
      - uses: actions/download-artifact@v8
        with:
          name: VoiceToText-android
      # Manifeste lu par l'application (releases/latest/download/latest.json) :
      # version, URL de l'installeur et sa signature.
      - name: Manifeste de mise à jour
        env:
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls *.exe)
          test -f "$exe.sig" || { echo "::error::signature $exe.sig absente"; exit 1; }
          EXE="$exe" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          tag, exe = os.environ["TAG"], os.environ["EXE"]
          entry = {
              "signature": open(f"{exe}.sig").read().strip(),
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{exe}",
          }
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"windows-x86_64": entry, "windows-x86_64-nsis": entry},
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          cat latest.json
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" *.exe *.exe.sig *.apk *.aab latest.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
  # Google Play : l'AAB part sur la piste choisie (variables PLAY_TRACK,
  # PLAY_STATUS du dépôt), une fois la release GitHub publiée ; un échec ici
  # ne la bloque pas. Sauté tant que le secret PLAY_SERVICE_ACCOUNT_JSON
  # n'existe pas (la toute première version s'envoie à la main).
  play:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: VoiceToText-android
      - name: Envoi sur Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_STATUS: ${{ vars.PLAY_STATUS }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::secret PLAY_SERVICE_ACCOUNT_JSON absent : pas d'envoi sur Google Play"
            exit 0
          fi
          .github/scripts/play-upload.sh VoiceToText_*_play.aab "$GITHUB_REF_NAME"
