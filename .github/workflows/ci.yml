name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système (WebKitGTK, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: SDK Vulkan (compilation de whisper.cpp pour le GPU)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p vtt-core -p vtt-platform --all-targets -- -D warnings
      - run: cargo test -p vtt-core -p vtt-platform
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Installeur
        working-directory: apps/desktop
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-installeur-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoiceToText-installeur-windows
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" *.exe --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
