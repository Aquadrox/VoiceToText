name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un nouveau push sur une PR annule la vérification devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Détection des fichiers modifiés (voir .github/scripts/changes.sh).
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # whisper.cpp (ggml) est compilé par défaut pour le processeur exact de la
  # machine de compilation (-march=native) : un serveur GitHub avec AVX-512
  # produisait un programme qui plantait (SIGILL, instruction illégale) sur
  # le Steam Deck. OFF : jeu d'instructions fixe (AVX2, FMA, F16C), présent
  # sur tous les PC depuis 2013 environ, Deck compris.
  # Changer une variable GGML_* ne recompile pas whisper.cpp déjà en cache :
  # changer aussi les `prefix-key` des jobs windows et appimage.
  GGML_NATIVE: "OFF"

jobs:
  linux:
    runs-on: ubuntu-latest
    # Un outil bloqué (téléchargement, compilation) ne doit pas occuper la CI
    # 6 h (délai par défaut de GitHub) : chaque job a un plafond large.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Les jobs `linux` et `windows` sont obligatoires pour merger : ils
      # tournent toujours, et ne sautent leurs étapes que pour une PR de doc.
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      # Une release v1.2.3 doit contenir la version 1.2.3 : sinon l'installeur
      # publié afficherait une autre version.
      - name: Version du tag = version du code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, mais Cargo.toml indique $version : monter la version avant de taguer"
            exit 1
          fi
      # Chaque version a ses notes, affichées avec la mise à jour : vérifié
      # sur toutes les PR (quelques millisecondes, même pour la doc).
      - name: Notes de version (CHANGELOG.md)
        run: python3 .github/scripts/changelog.py check
      - name: Dépendances système (WebKitGTK, ALSA)
        if: steps.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
        with:
          # Cache alimenté par `main` seulement, réutilisé par les PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all --check
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy ${{ steps.changes.outputs.packages }} --all-targets -- -D warnings
      - if: steps.changes.outputs.code == 'true'
        run: cargo test ${{ steps.changes.outputs.packages }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # La compilation de ggml-vulkan imbrique des dossiers profonds : avec le
      # chemin par défaut, MSBuild dépasse la limite de 260 caractères.
      # D: est le disque du dépôt (D:\a\VoiceToText\VoiceToText).
      CARGO_TARGET_DIR: D:\t
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Les jobs `linux` et `windows` sont obligatoires pour merger : ils
      # tournent toujours, et ne sautent leurs étapes que pour une PR de doc.
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      - name: SDK Vulkan (compilation de whisper.cpp pour le GPU)
        if: steps.changes.outputs.code == 'true'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
        with:
          # Chemin relatif au dépôt : rust-cache le colle derrière la racine,
          # un chemin absolu (C:\t) donnait un dossier inexistant et un cache
          # sans aucun fichier compilé.
          workspaces: ". -> ../../../t"
          # Changer le préfixe repart d'un cache vide (v1 ne contenait que
          # les sources téléchargées ; v2, whisper.cpp compilé en natif).
          prefix-key: v3-rust
          # Cache alimenté par `main` seulement (avec la compilation release),
          # réutilisé par les PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy -p vtt-core -p vtt-platform --all-targets -- -D warnings
      - if: steps.changes.outputs.code == 'true'
        run: cargo test -p vtt-core -p vtt-platform
      # CLI Tauri précompilée (npm) : `cargo install tauri-cli` la recompilait
      # en ~10 min à chaque cache vide.
      - name: Installeur
        if: steps.changes.outputs.code == 'true' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis
      # Release : installeur signé pour la mise à jour automatique. Les
      # secrets ne sont lus qu'ici (tags), jamais dans les PR.
      - name: Installeur signé (release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY absent : impossible de signer la release"
            exit 1
          fi
          npx --yes @tauri-apps/cli@^2 build --bundles nsis --config updater.conf.json
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          name: VoiceToText-installeur-windows
          # .sig : signature de l'installeur (releases uniquement).
          path: |
            D:\t\release\bundle\nsis\*.exe
            D:\t\release\bundle\nsis\*.exe.sig
          if-no-files-found: error
          # Artefacts de test gardés 14 jours (ceux d'un tag sont publiés dans
          # la release par le job release, dans la même exécution).
          retention-days: 14

  # Application Linux (Steam Deck en mode Bureau, PC sous X11) : AppImage,
  # un seul fichier, rien à installer (SteamOS ne garde pas les paquets
  # installés à la main). PR et `main` : AppImage de test ; tags : AppImage
  # signée pour la mise à jour automatique. Pas obligatoire pour merger,
  # mais la release l'attend.
  appimage:
    # Une AppImage ne démarre qu'avec une glibc au moins aussi récente que
    # celle de la compilation : compilée dans un conteneur Ubuntu 22.04
    # (glibc 2.35), elle reste compatible avec les systèmes un peu anciens,
    # sans dépendre de l'image ubuntu-22.04 de GitHub (retirée le 17/04/2027).
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      # Pas de FUSE dans un conteneur : les outils AppImage de Tauri
      # (linuxdeploy) s'extraient au lieu de se monter.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      # git avant checkout : sans lui, l'action télécharge les sources sans
      # l'historique dont changes.sh a besoin.
      - name: Outils de base (git, curl)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      # clang : bindgen (whisper-rs-sys). libvulkan-dev : bibliothèque pour
      # l'édition de liens (-lvulkan).
      - name: Dépendances système (WebKitGTK, ALSA, Vulkan, outils AppImage)
        if: steps.changes.outputs.code == 'true'
        run: |
          apt-get install -y --no-install-recommends build-essential pkg-config cmake clang \
            libclang-dev xz-utils file patchelf libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev \
            libvulkan-dev
      # SDK Vulkan officiel (LunarG), version figée : Ubuntu 22.04 n'a ni
      # glslc ni des en-têtes assez récents pour ggml-vulkan. Seuls les
      # en-têtes, les bibliothèques et glslc sont extraits (367 Mo compressés).
      - name: SDK Vulkan (compilation de whisper.cpp pour le GPU)
        if: steps.changes.outputs.code == 'true'
        env:
          VULKAN_VERSION: "1.4.363.1"
        run: |
          mkdir -p /opt/vulkan
          curl -sSfL --retry 3 \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_VERSION.tar.xz" \
            | tar -xJ -C /opt/vulkan --wildcards "$VULKAN_VERSION/x86_64/include/*" \
              "$VULKAN_VERSION/x86_64/lib/*" "$VULKAN_VERSION/x86_64/bin/glslc"
          echo "VULKAN_SDK=/opt/vulkan/$VULKAN_VERSION/x86_64" >> "$GITHUB_ENV"
          echo "/opt/vulkan/$VULKAN_VERSION/x86_64/bin" >> "$GITHUB_PATH"
      # CLI Tauri par npm (Node d'Ubuntu 22.04 trop ancien).
      - uses: actions/setup-node@v5
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.code == 'true'
        with:
          # v1 : whisper.cpp compilé en natif (voir GGML_NATIVE) ; v2 : hors
          # conteneur (autres bibliothèques système).
          prefix-key: v3-appimage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: AppImage
        if: steps.changes.outputs.code == 'true' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage --features vulkan
      # Release : AppImage signée (même clé que l'installeur Windows). Les
      # secrets ne sont lus qu'ici (tags), jamais dans les PR.
      - name: AppImage signée (release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY absent : impossible de signer la release"
            exit 1
          fi
          npx --yes @tauri-apps/cli@^2 build --bundles appimage --features vulkan --config updater.conf.json
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          name: VoiceToText-linux
          # .sig : signature de l'AppImage (releases uniquement).
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 14

  # Application Android : moteur Rust (vtt-android) compilé pour ARM64, puis
  # APK. PR et `main` : APK de test (identifiant .test, installable à côté de
  # la version publiée) ; tags : APK de release signé avec la clé du projet.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: "29.0.14206865"
      CMAKE_VERSION: "3.31.6"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fichiers modifiés
        id: changes
        shell: bash
        run: .github/scripts/changes.sh
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.android == 'true'
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.android == 'true'
        with:
          prefix-key: v1-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Outils Android (NDK, CMake) et cargo-ndk
        if: steps.changes.outputs.android == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" >/dev/null
          cargo install cargo-ndk --locked
      - if: steps.changes.outputs.android == 'true'
        run: cargo clippy -p vtt-android --all-targets -- -D warnings
      - if: steps.changes.outputs.android == 'true'
        run: cargo test -p vtt-android
      - name: Moteur natif (ARM64)
        if: steps.changes.outputs.android == 'true'
        run: apps/android/build-native.sh
      - name: APK de test
        if: steps.changes.outputs.android == 'true' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/clavier/debug/app-clavier-debug.apk dist/VoiceToText-test.apk
          cp app/build/outputs/apk/bulle/debug/app-bulle-debug.apk dist/VoiceToText-test-bulle.apk
      # Release : APK signé. Les secrets ne sont lus qu'ici (tags), jamais
      # dans les PR ; le fichier de clé n'existe que le temps de la signature.
      - name: APK signé (release)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 absent : impossible de signer l'APK"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/voicetotext.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/clavier/release/app-clavier-release.apk "dist/VoiceToText_${version}_android.apk"
          cp app/build/outputs/apk/bulle/release/app-bulle-release.apk "dist/VoiceToText_${version}_android-bulle.apk"
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.android == 'true'
        with:
          name: VoiceToText-android
          path: apps/android/dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, appimage, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Sources à part (src/) : historique et tags, pour comparer les versions.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: src
      - uses: actions/download-artifact@v8
        with:
          name: VoiceToText-installeur-windows
      - uses: actions/download-artifact@v8
        with:
          name: VoiceToText-linux
      - uses: actions/download-artifact@v8
        with:
          name: VoiceToText-android
      # Notes de version (CHANGELOG.md) : en tête de la release GitHub, et
      # dans le champ `changelog` des manifestes, que l'application affiche
      # avec la mise à jour proposée (versions plus récentes que l'installée).
      - name: Notes de version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 src/.github/scripts/changelog.py manifest "$TAG" > changelog.txt
          {
            echo "## Nouveautés"
            echo
            python3 src/.github/scripts/changelog.py notes "$TAG"
            echo
          } > notes.md
          cat notes.md
      # Une mise à jour n'est proposée qu'aux plateformes dont l'application
      # change depuis la version qu'elles annoncent déjà (manifestes de la
      # release précédente). Sinon, leur manifeste est repris tel quel : il
      # pointe toujours vers l'installeur de l'ancienne release, la version ne
      # monte pas, et l'application ne voit rien à installer. Les installeurs
      # sont publiés quand même, pour les nouvelles installations.
      # Au moindre doute (pas de manifeste, tag introuvable), tout est proposé.
      - name: Plateformes touchées
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --dir previous \
            --pattern latest.json --pattern latest-android.json \
            || echo "manifestes précédents introuvables : mise à jour proposée partout"
          {
            echo "## Mises à jour proposées"
            echo
          } >> notes.md
          for platform in windows android; do
            case "$platform" in
              windows) file=latest.json label="PC (Windows, Linux)" ;;
              android) file=latest-android.json label=Android ;;
            esac
            changed=true
            if [ -f "previous/$file" ]; then
              prev=$(jq -r .version "previous/$file")
              if git -C src rev-parse -q --verify "refs/tags/v$prev" >/dev/null; then
                result=$(cd src && python3 .github/scripts/platforms.py "v$prev" "$TAG")
                echo "$label, depuis v$prev :"
                jq -r ".reasons.$platform[] | \"  \" + ." <<<"$result"
                changed=$(jq -r ".$platform" <<<"$result")
              else
                echo "::warning::tag v$prev introuvable : mise à jour $label proposée"
              fi
            fi
            echo "$platform=$changed" >> "$GITHUB_OUTPUT"
            if [ "$changed" = true ]; then
              echo "- $label : oui" >> notes.md
            else
              echo "$label : rien de changé depuis v$prev, manifeste repris"
              cp "previous/$file" "$file"
              echo "- $label : non, rien ne change sur $label (la v$prev reste proposée)" >> notes.md
            fi
          done
          echo >> notes.md
          cat notes.md
      # Manifeste lu par l'application (releases/latest/download/latest.json) :
      # version, URL de l'installeur Windows et de l'AppImage Linux avec leur
      # signature, notes de version (`changelog` ; `notes` reste l'adresse de
      # la release).
      - name: Manifeste de mise à jour
        if: steps.platforms.outputs.windows == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          exe=$(ls *.exe)
          appimage=$(ls *.AppImage)
          for file in "$exe" "$appimage"; do
            test -f "$file.sig" || { echo "::error::signature $file.sig absente"; exit 1; }
          done
          EXE="$exe" APPIMAGE_FILE="$appimage" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          tag = os.environ["TAG"]
          def entry(name):
              return {
                  "signature": open(f"{name}.sig").read().strip(),
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}",
              }
          windows, linux = entry(os.environ["EXE"]), entry(os.environ["APPIMAGE_FILE"])
          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "changelog": open("changelog.txt", encoding="utf-8").read().strip(),
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": windows,
                  "windows-x86_64-nsis": windows,
                  "linux-x86_64": linux,
                  "linux-x86_64-appimage": linux,
              },
          }
          json.dump(manifest, open("latest.json", "w"), indent=2)
          PY
          cat latest.json
      # Manifeste lu par l'application Android
      # (releases/latest/download/latest-android.json) : à part de latest.json,
      # dont Tauri exige une signature minisign pour chaque entrée. Une entrée
      # par édition (le téléphone reste sur la sienne), avec taille et SHA-256
      # vérifiés avant l'installation ; Android vérifie en plus la signature.
      - name: Manifeste de mise à jour Android
        if: steps.platforms.outputs.android == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          version = tag.removeprefix("v")
          def entry(name):
              assert os.path.isfile(name), f"{name} absent"
              return {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": hashlib.sha256(open(name, "rb").read()).hexdigest(),
                  "size": os.path.getsize(name),
              }
          manifest = {
              "version": version,
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "changelog": open("changelog.txt", encoding="utf-8").read().strip(),
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "android-clavier": entry(f"VoiceToText_{version}_android.apk"),
                  "android-bulle": entry(f"VoiceToText_{version}_android-bulle.apk"),
              },
          }
          json.dump(manifest, open("latest-android.json", "w"), indent=2)
          PY
          cat latest-android.json
      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" *.exe *.exe.sig *.AppImage *.AppImage.sig *.apk latest.json latest-android.json --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --generate-notes
