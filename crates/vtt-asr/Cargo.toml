[package]
name = "vtt-asr"
description = "Transcription locale via whisper.cpp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Accélération GPU via Vulkan (pilote NVIDIA/AMD/Intel, rien à embarquer).
vulkan = ["whisper-rs/vulkan"]

[dependencies]
log.workspace = true
vtt-core = { path = "../vtt-core" }
whisper-rs = { version = "0.16", features = ["log_backend"] }

[dev-dependencies]
hound = "3"
