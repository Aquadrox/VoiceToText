[package]
name = "vtt-asr"
description = "Transcription locale : whisper.cpp, Parakeet (ONNX Runtime), Vosk"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Accélération GPU via Vulkan (pilote NVIDIA/AMD/Intel, rien à embarquer).
vulkan = ["whisper-rs/vulkan"]

[dependencies]
# Vosk : bibliothèque native téléchargée avec le modèle, chargée à l'exécution.
libloading = "0.8"
log.workspace = true
# Parakeet : ONNX Runtime (onnxruntime.dll officiel) téléchargé avec le
# modèle et chargé à l'exécution : rien de plus dans l'installeur.
parakeet-rs = { version = "0.4.4", default-features = false, features = ["load-dynamic", "api-28"] }
serde_json.workspace = true
vtt-core = { path = "../vtt-core" }
whisper-rs = { version = "0.16", features = ["log_backend"] }

[dev-dependencies]
hound = "3"
