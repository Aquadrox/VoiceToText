[package]
name = "vtt-android"
description = "VoiceToText sur Android : moteur de dictée appelé par l'application Kotlin (JNI)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# cdylib : libvtt_android.so chargée par l'application ; rlib : tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ureq = "3"
# Modèle Vosk : archive zip.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Whisper, Parakeet (ONNX Runtime) et Vosk : bibliothèques natives des deux
# derniers fournies dans l'APK (apps/android/build-native.sh).
vtt-asr = { path = "../vtt-asr", default-features = false, features = ["parakeet", "vosk"] }
vtt-core = { path = "../vtt-core" }
vtt-llm = { path = "../vtt-llm" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
