[package]
name = "vtt-platform"
description = "Intégration système : micro, clavier, insertion de texte"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18"
log.workspace = true
vtt-core = { path = "../vtt-core" }

[target.'cfg(windows)'.dependencies]
arboard = "3"
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Presse-papier X11, et Wayland par le protocole « data control » (KDE) : la
# même bibliothèque que sous Windows.
arboard = { version = "3", features = ["wayland-data-control"] }
# Chiffrement des enregistrements de réunion (équivalent de DPAPI) : clé
# aléatoire gardée dans le trousseau de la session.
chacha20poly1305 = "0.10"
# Clavier virtuel (uinput) pour les frappes simulées sous Wayland.
libc = "0.2"
# Sortie JSON de pactl / pw-dump (détection des appels).
serde_json.workspace = true
# Trousseau de la session (KWallet, GNOME Keyring) via D-Bus, en Rust pur.
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
# Bus D-Bus de la session : contrôle des lecteurs (MPRIS).
zbus = "5"
# Protocole X11 en Rust pur : touches (XInput2), frappes simulées (XTest),
# changements du presse-papier (XFixes).
x11rb = { version = "0.13", features = ["xfixes", "xinput", "xtest"] }
